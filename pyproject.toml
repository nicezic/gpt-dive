[project]
name = "gpt-dive"
version = "0.1.0"
description = "MCP runtime for GPT to dive into the user's local development environment"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.19",
    "pydantic-ai-slim[anthropic,openai-codex]",
    "pydantic-ai-harness==0.18.1",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.2",
]

[tool.uv.sources]
pydantic-ai-slim = { git = "https://github.com/Wh1isper/pydantic-ai.git", rev = "af055625bf67", subdirectory = "pydantic_ai_slim" }

[tool.uv]
# Harness targets upstream Pydantic AI version metadata; keep Dive's Codex-enabled fork.
exclude-dependencies = [
    { package = { name = "pydantic-ai-harness" }, dependencies = ["pydantic-ai-slim"] },
]

[project.scripts]
gpt-dive = "gpt_dive.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_dive"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
