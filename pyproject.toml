[project]
name = "gpt-dive"
version = "0.1.0"
description = "MCP runtime for GPT to dive into the user's local development environment"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.19",
    "pydantic-ai-slim[anthropic,openai]",
    "pydantic-ai-harness==0.21.0",
    "filelock>=3.20.3",
    "playwright>=1.62.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.2",
]

[project.scripts]
gpt-dive = "gpt_dive.__main__:main"
gpt-dive-council = "gpt_dive.council.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_dive"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
