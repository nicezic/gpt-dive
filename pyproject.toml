[project]
name = "gpt-dive"
version = "0.1.0"
description = "MCP runtime for GPT to dive into the user's local development environment"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.23",
    "pydantic-ai-slim[anthropic,openai]",
    "pydantic-ai-harness>=0.29.0",
    "redis>=6.0.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[project.scripts]
gpt-dive = "gpt_dive.__main__:main"
gpt-dive-conduit = "gpt_dive.conduit.__main__:main"
gpt-dive-conduit-log = "gpt_dive.conduit.consumer:main"
gpt-dive-council = "gpt_dive.council.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_dive"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
# Keep docs' Python snippets untouched (0.16 formats Markdown code blocks by default).
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Conservative, explicit rule set: immune to future default-set changes
# (0.16.0 jumped defaults from 59 to 413 rules). Stable prefixes only.
preview = false
select = [
  "E4", "E7", "E9", # pycodestyle errors
  "F",              # pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # flake8-bugbear
  "SIM",            # flake8-simplify
  "C4",             # flake8-comprehensions
  "RUF",            # ruff-specific
]
