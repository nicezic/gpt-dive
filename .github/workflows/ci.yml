name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Python 3.14 + dependencies
        run: |
          python -m pip install uv
          uv python install 3.14
          uv sync --frozen --python 3.14

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright Basic
        run: uv run pyright src

      - name: Pytest
        run: uv run pytest -q
